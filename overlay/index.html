<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Race Draw Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    width: 300px;
    overflow: hidden;
  }

  .widget {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
  }

  /* ── Header ── */
  .header {
    background: rgba(10, 10, 10, 0.92);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-title {
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    line-height: 1;
  }

  .header-subtitle {
    color: #ffffff50;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 3px;
  }

  .entry-count-badge {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border-radius: 8px;
    padding: 5px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 52px;
  }

  .count-number {
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
  }

  .count-label {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ffffff60;
    margin-top: 1px;
  }

  /* ── Prize Panel ── */
  .prize-panel {
    background: rgba(10, 10, 10, 0.92);
    border-radius: 10px;
    padding: 10px 14px;
  }

  .prize-title {
    color: #ffffff40;
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .prize-item {
    color: #ccc;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 2px;
    font-weight: 500;
  }

  .prize-item::before {
    content: '—';
    color: #ffffff30;
    font-size: 10px;
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 8px 0;
  }

  .how-to-enter {
    color: #888;
    font-size: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .cmd {
    background: rgba(255,255,255,0.12);
    color: #fff;
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.5px;
  }

  /* ── Entry Feed ── */
  .feed-header {
    color: #ffffff30;
    font-size: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 2px 4px 0;
  }

  .entries-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .entry-card {
    background: rgba(10, 10, 10, 0.92);
    border-radius: 8px;
    padding: 7px 10px;
    display: flex;
    align-items: center;
    gap: 9px;
    animation: slideIn 0.35s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    position: relative;
    overflow: hidden;
  }

  .entry-card.new-entry {
    background: rgba(255,255,255,0.06);
  }

  .avatar, .avatar-initials {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    background: rgba(255,255,255,0.06);
  }

  .avatar-initials {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 11px;
    font-weight: 700;
  }

  .entry-info { flex: 1; min-width: 0; }

  .entry-name {
    color: #eee;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .entry-time {
    color: #ffffff30;
    font-size: 9px;
    margin-top: 1px;
  }

  .entry-number {
    color: #ffffff25;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* ── Status ── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 4px;
  }

  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  .status-dot.disconnected { background: #666; animation: none; }

  .status-text {
    color: #ffffff25;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }
</style>
</head>
<body>
<div class="widget">

  <div class="header">
    <div>
      <div class="header-title">24H Race Draw</div>
      <div class="header-subtitle">Live Entries</div>
    </div>
    <div class="entry-count-badge">
      <span class="count-number" id="count">0</span>
      <span class="count-label">Entered</span>
    </div>
  </div>

  <div class="prize-panel">
    <div class="prize-title">Prizes</div>
    <div class="prize-item">10% SimLab Voucher</div>
    <div class="prize-item">SparksTheory Hoodie</div>
    <div class="divider"></div>
    <div class="how-to-enter">
      Type <span class="cmd">!enter</span> in chat to join the draw
    </div>
  </div>

  <div class="feed-header">Recent Entries</div>
  <div class="entries-list" id="entriesList"></div>

  <div class="status-bar">
    <div class="status-dot disconnected" id="statusDot"></div>
    <div class="status-text" id="statusText">Loading…</div>
  </div>

</div>

<script>
  const MAX_VISIBLE = 8;
  const DATA_FILE = './draw_data.json';
  const POLL_MS = 2000;

  let lastCount = -1;

  async function poll() {
    try {
      const res = await fetch(DATA_FILE + '?t=' + Date.now());
      if (!res.ok) { setStatus(false); return; }
      const data = await res.json();
      setStatus(true);
      if (data.totalEntries === lastCount) return;
      lastCount = data.totalEntries;
      document.getElementById('count').textContent = data.totalEntries;
      const recent = (data.entries || []).slice(-MAX_VISIBLE).reverse();
      renderAll(recent, data.totalEntries);
    } catch (e) {
      setStatus(false);
    }
  }

  function renderAll(entries, totalCount) {
    const list = document.getElementById('entriesList');
    list.innerHTML = '';
    entries.forEach((entry, i) => {
      const card = document.createElement('div');
      const isNewest = i === 0;
      card.className = 'entry-card' + (isNewest ? ' new-entry' : '');

      const avatarHtml = entry.userAvatar
        ? `<img class="avatar" src="${entry.userAvatar}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" alt=""><div class="avatar-initials" style="display:none">${initials(entry.userName)}</div>`
        : `<div class="avatar-initials">${initials(entry.userName)}</div>`;

      card.innerHTML = `
        ${avatarHtml}
        <div class="entry-info">
          <div class="entry-name">${escHtml(entry.userName)}</div>
          <div class="entry-time">${formatTime(entry.timestamp)}</div>
        </div>
        <div class="entry-number">#${totalCount - i}</div>
      `;
      list.appendChild(card);
      if (isNewest) setTimeout(() => card.classList.remove('new-entry'), 3500);
    });
  }

  function initials(n) { return (n || '?').slice(0, 2).toUpperCase(); }

  function escHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str || ''));
    return d.innerHTML;
  }

  function formatTime(ts) {
    try { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    catch { return ''; }
  }

  function setStatus(ok) {
    document.getElementById('statusDot').className = 'status-dot' + (ok ? '' : ' disconnected');
    document.getElementById('statusText').textContent = ok ? 'Draw Live' : 'Waiting for data…';
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
